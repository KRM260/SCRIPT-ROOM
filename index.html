<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Script Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout concept: a writers' room desk. Left, a five-step guided form whose tabs borrow the
   colours of real script revision pages (white, blue, pink, yellow, green). Right, a live
   "script bible" that fills in as you type. The last step drafts the script on screenplay paper. */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F4F6F8; --ink:#12161C; --ink-2:#4B5563;
  --line:#D8DDE4; --accent:#2A55D4; --accent-soft:#E2E9FB; --on-ink:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#1A1D22; --ok:#1E7A4C; --warn:#9A5F08; --err:#B3261E;
  --rev-white:#F7F7F4; --rev-blue:#8FB8F2; --rev-pink:#F0A3BC; --rev-yellow:#EBD15E; --rev-green:#93D19B; --rev-gold:#E3B04B; --rev-buff:#D9C3A0;
  --shadow:0 12px 30px -20px rgba(18,22,28,.45);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-script:'Courier Prime','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --ink:#E9EDF3; --ink-2:#A3ACBA;
    --line:#2B313C; --accent:#8AA6FF; --accent-soft:#222C4C; --on-ink:#0D1015;
    --paper:#1B2029; --paper-ink:#E6E9EE; --ok:#6FD39C; --warn:#E5B35A; --err:#FF8A80;
    --rev-white:#DADFE8; --rev-blue:#6E9AD9; --rev-pink:#D27E9A; --rev-yellow:#C9B04A; --rev-green:#6FB07A; --rev-gold:#B98C3A; --rev-buff:#A89572;
    --shadow:0 12px 30px -20px rgba(0,0,0,.8); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1015; --surface:#161A21; --surface-2:#1D222B; --ink:#E9EDF3; --ink-2:#A3ACBA;
  --line:#2B313C; --accent:#8AA6FF; --accent-soft:#222C4C; --on-ink:#0D1015;
  --paper:#1B2029; --paper-ink:#E6E9EE; --ok:#6FD39C; --warn:#E5B35A; --err:#FF8A80;
  --rev-white:#DADFE8; --rev-blue:#6E9AD9; --rev-pink:#D27E9A; --rev-yellow:#C9B04A; --rev-green:#6FB07A; --rev-gold:#B98C3A; --rev-buff:#A89572;
  --shadow:0 12px 30px -20px rgba(0,0,0,.8); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:38px;height:30px;border-radius:6px;border:2px solid var(--ink);position:relative;overflow:hidden;flex:none;
  background:repeating-linear-gradient(-55deg,var(--ink) 0 7px,var(--surface) 7px 14px)}
.mark::after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:var(--surface);border-top:2px solid var(--ink)}
.brand h1{font-size:26px;line-height:1}
.brand small{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved{font-size:12.5px;color:var(--ink-2)}

/* buttons and controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px;line-height:1.2}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2);max-width:100%}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;border-right:1px solid var(--line);font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.field{display:grid;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.hint{margin:0;font-size:13px;color:var(--ink-2)}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input::placeholder,textarea::placeholder{color:var(--ink-2);opacity:.7}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{display:grid;gap:14px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stack{display:grid;gap:18px}
@media (max-width:640px){.two{grid-template-columns:minmax(0,1fr)}}

/* step tabs */
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);gap:8px;margin:20px 0 16px;overflow-x:auto;padding-bottom:4px}
.tab{--rev:var(--rev-white);text-align:left;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--rev);
  border-radius:10px;padding:9px 11px;cursor:pointer;display:grid;gap:1px;min-width:0;position:relative}
.tab .t{font-weight:600;font-family:var(--f-display);font-size:16px}
.tab .r{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.tab[aria-current="step"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tab.done::after{content:"\2713";position:absolute;right:9px;top:9px;font-size:12px;color:var(--ok);font-weight:700}
@media (max-width:560px){.tab .r{display:none}.tab{padding:14px 6px 8px}.tab .t{font-size:14px}.tab.done::after{top:3px;right:5px;font-size:10px}}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 370px}
  .sum{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;min-width:0}
@media (max-width:560px){.panel{padding:16px}}
.phead{display:grid;gap:4px;margin-bottom:20px}
.phead h2{font-size:28px}
.phead p{margin:0;color:var(--ink-2)}
.pfoot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);
  border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:14px}

/* format picker, presets, cards */
.fmts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.fmt{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:1px}
.fmt b{font-family:var(--f-display);font-weight:600}
.fmt span{font-size:12.5px;color:var(--ink-2)}
.fmt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.lenbox{display:grid;gap:10px}
.lenrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lenrow input[type=number]{width:96px}
.lenrow .unit{color:var(--ink-2)}
.info{font-size:13.5px;color:var(--ink-2);margin:0}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;background:var(--surface)}
.chead{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.chead h3{font-size:18px}
.chead .acts{display:flex;gap:6px}
.slug{font-family:var(--f-script);font-weight:700;font-size:14px;letter-spacing:.01em;overflow-wrap:anywhere}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.pack{border:1px dashed var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;gap:2px}
.pack:hover{border-style:solid;border-color:var(--accent)}
.pack b{font-weight:600}
.pack span{font-family:var(--f-script);font-size:12.5px;color:var(--ink-2)}
.sect{display:grid;gap:10px}
.sect>h3{font-size:15px;font-family:var(--f-body);font-weight:600}
.dens{display:grid;gap:4px}
.dens output{font-size:13.5px;color:var(--ink-2)}

/* summary */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.sum h2{font-size:15px;font-family:var(--f-body);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:12px}
.page{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:20px 18px;font-family:var(--f-script);font-size:13px;line-height:1.5;display:grid;gap:12px;box-shadow:var(--shadow)}
.page .ttl{text-align:center;text-transform:uppercase;font-weight:700;font-size:15px;letter-spacing:.03em;overflow-wrap:anywhere}
.page .meta{text-align:center;color:var(--ink-2);font-size:12px}
.page .log{margin:0;font-style:italic;overflow-wrap:anywhere}
.page h4{margin:4px 0 0;font:700 12px var(--f-script);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.page ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.page li{overflow-wrap:anywhere}
.page li small{color:var(--ink-2)}
.empty{color:var(--ink-2)}
.ready{margin-top:14px;display:grid;gap:6px}
.ready h3{font-size:13px;font-family:var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.ck{display:flex;gap:8px;align-items:baseline;font-size:14px;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ck i{font-style:normal;width:16px;text-align:center;color:var(--ink-2)}
.ck.ok i{color:var(--ok);font-weight:700}
.ck.opt{color:var(--ink-2)}

/* output */
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:end}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.status{font-size:14px;color:var(--ink-2)}
.err{color:var(--err);font-size:14px;margin:0}
.note{color:var(--warn);font-size:14px;margin:0}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:30px 26px 40px;
  font-family:var(--f-script);font-size:14px;line-height:1.5;box-shadow:var(--shadow);overflow-wrap:anywhere}
.paper>*{margin-block:0 1em}
.paper .tp{text-align:center;padding:3.5em 0 3em;border-bottom:1px dashed var(--line);margin-bottom:2em}
.paper .tp .tt{font-size:1.5em;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:1.2em}
.paper .tp p{margin:0 0 .4em}
.paper .sl{font-weight:700;text-transform:uppercase;margin-top:1.8em}
.paper .ch{margin-left:22ch;margin-bottom:0;text-transform:uppercase}
.paper .pr{margin-left:16ch;margin-bottom:0}
.paper .dl{margin-left:10ch;max-width:36ch;margin-bottom:0}
.paper .end{margin-bottom:1em}
.paper .tr{text-align:right;text-transform:uppercase}
.paper .think{color:var(--ink-2);font-style:italic}
@media (max-width:560px){
  .paper{padding:22px 16px 30px;font-size:12.5px}
  .paper .ch{margin-left:12ch}.paper .pr{margin-left:8ch}.paper .dl{margin-left:4ch}
}
.studio{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;background:var(--surface-2)}
.studio h3{font-size:17px}
.toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.toast span{background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.nav.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:12px 8px}
.sec{scroll-margin-top:84px}
.dt{border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.dt>summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
.dt>summary::-webkit-details-marker{display:none}
.dt>summary::after{content:"+";color:var(--ink-2)}
.dt[open]>summary::after{content:"\2212"}
.dtb{padding:4px 12px 14px;display:grid;gap:14px}
.pairhead{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;flex-wrap:wrap}
.pairhead b{font-family:var(--f-display);font-size:17px;font-weight:600}
.sub{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:12px;background:var(--surface-2)}
.sub>b{font-family:var(--f-display);font-weight:600}
.next{border:1px solid var(--accent);border-radius:12px;padding:16px;display:grid;gap:10px;background:var(--surface)}
.next h3{font-size:17px}
.opt-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--surface-2)}
.opt-card p{margin:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-script);font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0}
.monop{font-family:var(--f-script);font-size:13.5px}
textarea.labta{font-family:var(--f-script);font-size:14px;line-height:1.5;min-height:300px}
.seg.wrap{display:flex;flex-wrap:wrap}
.seg.wrap button{border-bottom:1px solid var(--line)}
.picked{font-size:13px;color:var(--ink-2)}
.sec+.sec{margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}
.phead.pro{margin-bottom:14px}
.phead.pro h2{font-size:22px}
.modes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kbd{font:700 11px var(--f-script);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink-2);margin-left:6px}
.coach{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;display:grid;gap:6px;margin-bottom:18px}
.coach b{font-weight:600}
.coach .ex{font-family:var(--f-script);font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.coach button{justify-self:start}
.lblrow{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:26px;flex-wrap:wrap}
.aibtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;color:var(--accent);font-weight:600}
.aibtn:hover{border-color:var(--accent)}
.aibtn[disabled]{opacity:.5;cursor:not-allowed}
.sug{background:var(--surface-2);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.sug p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent)}
.tag.strength{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.risk{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.notes{display:grid;gap:10px}
.note-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:5px;background:var(--surface)}
.note-card h4{margin:0;font:600 16px var(--f-display)}
.note-card p{margin:0;font-size:14px;color:var(--ink-2)}
.pal{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.55);display:flex;justify-content:center;align-items:flex-start;
  padding:max(12vh,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pal-box{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal-box .pal-in{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;background:transparent;font-size:16px}
.pal-list{max-height:min(50vh,360px);overflow:auto;margin:0;padding:6px;list-style:none}
.pal-list li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pal-list li[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.pal-list li.empty{cursor:default;color:var(--ink-2)}
.pal-list small{color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.think{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}}

/* ---------- v5: editor, pages, school, tour, motion ---------- */
:root{--spk-1:#2A55D4;--spk-2:#C2410C;--spk-3:#0F766E;--spk-4:#BE185D;--spk-5:#6D28D9;--spk-6:#A16207;--spk-7:#0369A1;--spk-8:#4D7C0F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--spk-1:#8AA6FF;--spk-2:#FB923C;--spk-3:#2DD4BF;--spk-4:#F472B6;--spk-5:#A78BFA;--spk-6:#FACC15;--spk-7:#38BDF8;--spk-8:#A3E635}}
:root[data-theme="dark"]{--spk-1:#8AA6FF;--spk-2:#FB923C;--spk-3:#2DD4BF;--spk-4:#F472B6;--spk-5:#A78BFA;--spk-6:#FACC15;--spk-7:#38BDF8;--spk-8:#A3E635}
#stepPanel{view-transition-name:panel}
.meter{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px;background:var(--surface);cursor:pointer;font-size:12.5px;line-height:1.25;text-align:left}
.meter small{color:var(--ink-2);font-size:11.5px}
.meter .ring{display:grid}
.spe{display:grid;gap:10px;min-width:0}
.spe-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--surface);padding:8px 0}
.spe-bar .lbl{margin-right:4px}
.spk{--c:var(--spk-1);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 4px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:13.5px}
.spk i{width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--on-ink);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.spk .kbd{margin-left:0}
.spk:hover{border-color:var(--c)}
.spk[disabled]{opacity:.5;cursor:not-allowed}
.oth{width:150px!important;padding:6px 10px!important;border-radius:999px!important;font-size:13px}
.spe-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spe-tools .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.spe-tools .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.acflash{font-size:12.5px;color:var(--ok);font-family:var(--f-script);opacity:0}
.acflash.on{opacity:1}

  if(i===5){var s=S.style;return !!(s.ending||s.pov||s.pace||s.themes.trim()||s.visual.trim()||s.include.trim()||s.avoid.trim())}

function buildBrief(){
  var f=fmtOf(S.format),L=[];
  L.push('TITLE: '+(S.title.trim()||'Untitled'));
  if(S.writer.trim())L.push('WRITER: '+S.writer.trim());

  if(S.tones.length)L.push('TONE: '+S.tones.join(', '));
  L.push('LANGUAGE: '+langName(S.lang));var cbt=clientBriefText();if(cbt)L.push(cbt);L.push('PROJECT: '+(ptOf()?ptOf().l:fmtOf(S.format).l)+(S.treat?'. TREATMENT: '+S.treat+(TREAT_PH[S.treat]?' ('+TREAT_PH[S.treat]+')':''):''));var vr=voRule();if(vr)L.push(vr);L.push('STRUCTURE: '+actsOf().join(' / '));
  try{var sx=seriesCtx();if(sx)L.push(sx)}catch(e){}
  L.push('LOGLINE: '+(S.logline.trim()||'(none)'));
  L.push('SETTING: '+({one:'One location'+(S.setting.place.trim()?' ('+S.setting.place.trim()+')':'')+'. The whole story happens in this one place.',few:'A few locations',many:'Many locations'}[S.setting.mode]||'A few locations'));
  L.push('','CHARACTERS:');
  namedChars().forEach(function(c){
    var bits=[];if(c.traits.length)bits.push('Personality: '+c.traits.join(', ').toLowerCase());
    if(c.background.trim())bits.push('Background: '+c.background.trim());if(c.wants.trim())bits.push('Wants: '+c.wants.trim());
    if(c.struggle.trim())bits.push('Struggle: '+c.struggle.trim());if(c.secret.trim())bits.push('Secret: '+c.secret.trim());
    var lk=lookText(c);if(lk)bits.push('Looks: '+lk);var vt=voiceText(c);if(vt)bits.push('Voice: '+vt);if(c.wardrobe&&c.wardrobe.trim())bits.push('Wardrobe: '+c.wardrobe.trim());if(c.makeup&&c.makeup.trim())bits.push('Hair and makeup: '+c.makeup.trim());
    L.push('- '+c.name.trim().toUpperCase()+' ('+[c.role,c.age?'age '+c.age:''].filter(Boolean).join(', ')+')'+(bits.length?': '+bits.join(' | '):''))});
  if(!namedChars().length)L.push('(none given)');
  var rl=[];
  pairs().forEach(function(pr){var r=S.rels[pairKey(pr[0].id,pr[1].id)];if(!relFilled(r))return;var b=[];
    if(r.type.length)b.push(r.type.join(', ').toLowerCase());if(r.tone.length)b.push('they talk to each other in a '+r.tone.join(', ').toLowerCase()+' way');

    if(r.power)b.push('upper hand: '+(r.power==='equal'?'equal':(charById(r.power)?nm(charById(r.power)):'')));
    rl.push('- '+nm(pr[0]).toUpperCase()+' / '+nm(pr[1]).toUpperCase()+': '+b.join(' | '))});
  if(rl.length){L.push('','RELATIONSHIPS:');rl.forEach(function(x){L.push(x)})}
  L.push('','SCENES, IN ORDER:');

    var who=sc.cast.map(function(id){var c=charById(id);return c&&nm(c)?nm(c).toUpperCase():''}).filter(Boolean).join(', ');
    L.push((i+1)+'. '+(sc.label?'['+sc.label+'] ':'')+slug(sc)+(who?' | In scene: '+who:'')+(sc.beat.trim()?' | '+sc.beat.trim():''));convLines(sc).forEach(function(x){L.push('   '+x)});if(sc.locnotes&&sc.locnotes.trim())L.push('   Location look: '+sc.locnotes.trim());if(sc.props&&sc.props.length)L.push('   Props: '+sc.props.join(', '))})}
  else L.push('(none given. Structure the script yourself.)');
  var s=S.style,st=[];
  if(s.ending)st.push('Ending: '+s.ending);if(s.pov)st.push('Point of view: '+s.pov);if(s.pace)st.push('Pacing: '+s.pace);
  st.push('Dialogue: '+densLabel(s.density));
  if(s.themes.trim())st.push('Themes: '+s.themes.trim());if(s.visual.trim())st.push('Visual notes: '+s.visual.trim());
  if(s.include.trim())st.push('Must include: '+s.include.trim());if(s.avoid.trim())st.push('Avoid: '+s.avoid.trim());

var FORMAT_RULES='Output plain text only, in screenplay conventions: scene headings in capitals starting with INT., EXT. or INT./EXT., action in present tense, '+
  'each character cue on its own line as @NAME in capitals (for example @MAYA), dialogue on the lines below the cue, parentheticals in (brackets) on their own line, '+
  'a blank line between blocks. Use transitions only when they matter. No markdown, no title page, no commentary before or after.';
function langRule(){return S.lang==='en'?'':' Write the action and dialogue in '+langName(S.lang)+'. Keep INT./EXT. and the time words (DAY, NIGHT and so on) in English.'}
function scriptPrompt(){
  var m=S.lenMin,now=Math.min(m,30);
  var long=m>30?' This is a long format. Write only the first '+Math.round(now)+' pages now and stop at the end of a scene; the writer will ask you to continue.':'';
  return 'You are a professional screenwriter. Write a screenplay from this brief.\n\n'+buildBrief()+'\n\n'+
    'Length: about '+lenLabel(now)+' of screen time, roughly '+Math.round(now*175/10)*10+' words of script, within 15 percent.'+long+
    ' Follow the scenes in order. Add or merge scenes only if the length needs it. Dialogue is the heart of this script: give every character a distinct voice, let each conversation turn on what the characters want and hide, keep subtext high, and never let a character state their feelings outright. Use the conversation setups and relationships. Stay in the set location and use the objects in it. Begin with FADE IN: and, if the script is complete, end with FADE OUT.'+dialogueBlocks()+'\n'+FORMAT_RULES+langRule()}
function dialogueBlocks(){
  var parts=[];
  S.scenes.forEach(function(sc,i){if(sc.dialogue&&sc.dialogue.trim())parts.push('SCENE '+(i+1)+' ('+slug(sc)+'):\n'+sc.dialogue.trim())});
  return parts.length?'\n\nWRITER\u2019S DIALOGUE. Keep these lines and their voice. Only fix formatting and continuity, and add action lines around them:\n'+parts.join('\n\n'):''}
function outlinePrompt(){
  return 'You are a professional screenwriter and script editor. From this brief, write a beat outline.\n\n'+buildBrief()+'\n\n'+
    'Give one numbered beat per scene (add or merge scenes if the length needs it). Each beat: the slugline, then 2 to 4 lines on what happens, what changes, and what each character wants. '+
    'Finish with a short section "Notes" of three ideas that would strengthen the story. Plain text, no markdown symbols.'+langRule()}
function continuePrompt(){
  var done=words(S.out.text)/175,rem=S.lenMin-done,now=Math.max(1,Math.min(rem,30));
  var tail=S.out.text.slice(-14000);

    'Continue from exactly where it stops. Do not repeat anything. Write about '+Math.round(now)+' more pages. '+
    (rem<=30?'Reach the ending the brief asks for and finish with FADE OUT.':'Stop at the end of a scene; more will follow.')+'\n'+FORMAT_RULES+langRule()}
function revisePrompt(instr){

function toFountain(text){

  out.push('','====','');
  var lines=text.replace(/\r/g,'').split('\n'),dlg=false;
  function blank(){if(out.length&&out[out.length-1]!=='')out.push('')}
  for(var i=0;i<lines.length;i++){
    var t=lines[i].trim();
    if(!t){dlg=false;blank();continue}
    var next=(lines[i+1]||'').trim();
    if(HEAD.test(t)){blank();out.push(t.toUpperCase());out.push('');dlg=false}
    else if(TRANS.test(t)){blank();out.push('>'+t);out.push('');dlg=false}
    else if(t.charAt(0)==='@'){blank();out.push('@'+t.slice(1).trim().toUpperCase());dlg=true}
    else if(!dlg&&next&&isCue(t)){blank();out.push('@'+t);dlg=true}
    else if(dlg){out.push(t)}
    else{out.push(t);if(next&&(HEAD.test(next)||next.charAt(0)==='@'))out.push('')}

  {k:'subtext',t:'Subtext: talk about the mug, mean the father',sum:'The best lines are about one thing on the surface and another underneath.',

   apply:'Make the characters say less of what they mean. Let them talk about an object or a task while the real subject stays unsaid.'},

   notes:['He opens with a neutral question. He is probing, not chatting.','Concern used as reconnaissance. The tactic is kindness.','She answers the question he has not asked yet. She knows where this is going.','The want comes out. The polite surface now carries a threat.','Staging shows the power shift that the words hide.'],

var FILMS=[
  {f:'12 Angry Men',y:'1957',w:'Reginald Rose',scene:'The jury room. Eleven jurors vote guilty, one votes not guilty, and the whole film stays in one hot room.',tech:'One room, rising pressure',
   why:'There is a clock (a verdict), a reason nobody can leave, and twelve distinct voices. Each vote that changes is a turning point. Objects carry arguments: when a second, identical knife appears, a piece of evidence stops being unique.',steal:'Give each character one belief to defend and let the room flip them one at a time.'},

   why:'The officer\u2019s courtesy (asking for milk, praising the farm) is more frightening than shouting. We learn early that a family is hiding under the floor, so every polite line becomes unbearable. The scene turns when the farmer is finally asked the direct question.',steal:'Tell the audience the secret before the characters say it, then keep the dialogue polite.'},
  {f:'Heat',y:'1995',w:'Michael Mann',scene:'A detective and the thief he is hunting sit down for coffee and talk.',tech:'Two equals, mutual respect',
   why:'Neither raises his voice. They trade confessions about their lives and arrive at the same conclusion from opposite sides: neither will back down. The scene works because the stakes are stated plainly and the respect is real.',steal:'Put two opponents at a table and let them discover how alike they are.'},
  {f:'The Social Network',y:'2010',w:'Aaron Sorkin',scene:'The opening in a crowded bar. A student talks at his girlfriend until she ends the relationship.',tech:'Two conversations at once',
   why:'He is having a conversation about status; she is having one about whether he listens. They talk past each other at speed until she stops the scene with a clear decision. The opening tells us who he is better than any description.',steal:'Let each character pursue a different topic in the same exchange until one of them forces it to a point.'},
  {f:'Before Sunrise',y:'1995',w:'Richard Linklater and Kim Krizan',scene:'In a caf\u00E9, two strangers pretend to phone their friends and describe each other.',tech:'A game that allows the truth',
   why:'They cannot say what they feel directly, so they invent a game in which they can. The pretend calls let both confess while keeping a safe distance. It is subtext made into a device.',steal:'Give shy or proud characters a game, a role or a task that lets them say the true thing indirectly.'},
  {f:'No Country for Old Men',y:'2007',w:'Joel and Ethan Coen',scene:'A gas station. A killer chats with the elderly owner and makes him call a coin toss.',tech:'Small talk with a hidden stake',

/* ===================== explain my scene ===================== */
async function labExplain(){
  var sc=curScene();if(!sc||!sc.dialogue.trim()){toast('Write or draft some dialogue for this scene first.');return}
  var c=labStart();if(!c)return;
  var bs=parseBlocks(sc.dialogue);
  var listing=bs.map(function(b,i){return '['+i+'] '+(b.t==='speech'?b.who+(b.p?' ('+b.p+')':'')+': ':b.t.toUpperCase()+': ')+(b.x||'').replace(/\n/g,' ')}).join('\n');
  var prompt='You are a screenwriting teacher annotating a writer\u2019s scene so they understand why it works and where it can be better.\n\nCONTEXT:\n'+labCtx(sc)+'\n\nTHE SCENE, numbered by block:\n'+listing+
    '\n\nPick 4 to 7 blocks worth a note. For each, name the technique at work or missing (subtext, tactic, power shift, turn, objects, interruption, silence, exposition, voice) and explain in one or two plain sentences why it works or what to try. Mix strengths and risks. Write in '+noteLang()+
    '. Reply with only a JSON array of objects: {"block":number,"kind":"strength"|"risk"|"idea","technique":string,"note":string}.';
  var st=document.getElementById('lab-st');if(st)st.textContent='Reading your scene like a teacher\u2026';
  try{var arr=await caps.sample.json(prompt,{cache:false});
    var items=(Array.isArray(arr)?arr:[]).filter(function(x){return x&&typeof x.block==='number'&&x.block>=0&&x.block<bs.length}).slice(0,8);
    if(!items.length)lab.err='The AI did not return any notes. Try again.';else{lab.ann={sc:sc.id,text:sc.dialogue,items:items};toast(items.length+' notes added. Click the numbers in the margin.')}}
  catch(e){if(e&&e.code!=='cancelled')lab.err=sampleErr(e)}
  labEnd(true)}

   learn:['Voice is vocabulary, rhythm, what they notice and what they avoid. A doctor, a child and a poet describe the same rain differently.','Give each character a habit: short sentences, questions instead of answers, jokes under stress, never finishing a thought.','Dialect is part of voice. Use it in word choice and rhythm, and use spelling sparingly so actors can read it.'],
   why:['The audience follows who is who without effort.','Actors get a character to build.','Conflict sharpens when voices clash.'],
   scene:[['s','NADIA','Late.',1],['s','SAMIR','Late is a matter of perspective, my dear. The tram is never late. It is only patient.',2],['s','NADIA','It’s eleven minutes patient.',3]],
   notes:['One word. Nadia is blunt and tired.','Samir rambles, charms and philosophises.','She borrows his word to mock it: the clash defines both of them.'],
   mistakes:['Everyone speaks in the writer’s own voice.','Dialect written phonetically until it is unreadable.','Voice shown only in the first scene, then forgotten.'],
   exercise:'Write the same line ("We have to leave now") for three different characters from your project.',crit:'three clearly different voices; each reflects the character’s background and state; readable without names',
   quiz:[{q:'A good test for distinct voices is…',o:['Reading aloud fast','Covering the names','Counting words'],a:1,w:'If you still know who speaks, the voices work.'},
     {q:'Dialect works best through…',o:['Heavy phonetic spelling','Word choice and rhythm','Italics'],a:1,w:'Actors and readers can perform it without decoding.'},
     {q:'Which is a voice habit?',o:['Answers every question with a question','Is 34 years old','Lives in Beirut'],a:0,w:'A habit shows up in every line they speak.'}],apply:'Make each character sound unmistakably like themselves: vocabulary, rhythm and what they avoid saying.'},
  {k:'thirds',t:'Rule of thirds, headroom and look room',sum:'Put the eyes on the upper third line and give the face space to look into.',demo:'thirds',
   learn:['Divide the frame into three across and three down. In a single, the eyes sit on the upper horizontal line, and the face sits on one of the vertical lines.','Look room (nose room): put the space in front of the face, in the direction the person is looking. If they look screen right, place them on the left third.','Headroom shrinks as the shot gets tighter. In a close-up the top of the head can be cropped; in a medium shot there is a little air above the head. Too much headroom makes people look small and lost.','Centre framing is a choice, not a mistake: use it for symmetry, confrontation or a direct look to camera.'],
   why:['The eye goes to the intersections of the lines first, so the face lands there.','Look room makes the frame feel balanced and tells us where the other person is.','Correct headroom keeps the face, not the ceiling, as the subject.'],
   mistakes:['Eyes in the dead centre of the frame in every shot.','The person looks toward the near edge of the frame, with their back to empty space.','Too much headroom in close-ups.','Cutting at joints (knees, elbows, neck) in the frame edge.'],
   exercise:'Describe the framing of three shots from your scene: where the eyes are, which way the face looks, and how much headroom there is.',crit:'eyes placed on the upper third in singles; look room on the side of the look; headroom suits each shot size; any centring is justified',
   quiz:[{q:'A character looks screen right. Where do you place them?',o:['Right third','Left third','Dead centre'],a:1,w:'The empty space goes in front of the face: that is look room.'},
     {q:'In a medium close-up the eyes should sit…',o:['On the upper third line','On the lower third line','At the very top edge'],a:0,w:'Upper third keeps the face strong and the headroom right.'},
     {q:'When is centred framing a good choice?',o:['Never','For symmetry, confrontation or a look to camera','Only for wide shots'],a:1,w:'Breaking the rule works when it means something.'}],apply:'shots'},
  {k:'sizes',t:'Shot sizes and what they say',sum:'Wide shots show where we are. Close shots show what it means.',demo:'sizes',
   learn:['Shot sizes are named by where the frame cuts the body: extreme close-up (eyes), close-up (head and the top of the shoulders), medium close-up (mid-chest), medium (waist), cowboy (just above the knees), full (head to toe), wide (the person in their space).','Distance is emotion. The closer the camera, the more intimate and intense. Wide shots create isolation, scale or comedy.','Save your closest size for the moment that matters most. If everything is a close-up, nothing is.'],
   why:['Sizes guide the audience’s attention.','Changing size marks a change in the scene’s intensity.','Editors need a range of sizes to shape a scene.'],
   mistakes:['A whole dialogue scene in medium shots.','Jumping straight from a wide to an extreme close-up without reason.','Close-ups before the audience knows the geography.'],
   exercise:'Choose a size for every beat of one scene and say why each size fits that moment.',crit:'sizes tighten as tension rises; the closest size is saved for the turn; geography is established early',
   quiz:[{q:'Where does a medium close-up cut the body?',o:['At the waist','Mid-chest','At the knees'],a:1,w:'Medium close-up is about mid-chest: the face dominates but we see some body language.'},
     {q:'What does a wide shot often create?',o:['Intimacy','Isolation or scale','Confusion'],a:1,w:'Small figures in big spaces feel alone or overwhelmed.'},
     {q:'When should you use your tightest shot?',o:['At the turn of the scene','In every shot','Only for inserts'],a:0,w:'Intensity is relative: save it.'}],apply:'shots'},
  {k:'line',t:'The 180° rule and eyelines',sum:'Keep the camera on one side of the line between two people, so they keep facing each other.',demo:'line',
   learn:['Draw an imaginary line through two people in conversation: the line of action. Put every camera on the same side of it.','Then the person on the left always looks screen right and the person on the right always looks screen left. Cut between their singles and they still face each other.','If one shot crosses the line, both people look the same way on screen and the audience feels they have turned around or swapped places.','You can cross on purpose. Show the move: a camera that travels across the line in one shot, a character who walks across it, or a neutral shot straight down the line. After the cross, stay on the new side.'],
   why:['Consistent screen direction keeps the audience oriented without them noticing.','Matching eyelines make two separate shots feel like one conversation.','A deliberate cross can mark a shift in power or perspective.'],
   mistakes:['Shooting a reverse from the wrong side because it was easier on set.','Two singles where both people look screen left.','Crossing the line with a static cut and no bridge.'],
   exercise:'Plan a five-shot dialogue between two people with one deliberate line cross. Describe how you bridge it.',crit:'shots before the cross keep consistent eyelines; the cross is bridged by a moving camera, a character move, a neutral shot or a cutaway; shots after keep the new side',
   quiz:[{q:'In a conversation, A is frame-left. Which way should A look in their single?',o:['Screen right','Screen left','Into the lens'],a:0,w:'A looks toward B, who is on the right.'},
     {q:'Two singles where both look screen left mean…',o:['The line was crossed','Perfect coverage','A POV'],a:0,w:'Their eyelines no longer meet, so the camera crossed the line.'},
     {q:'Which bridges a deliberate cross?',o:['A hard cut between static shots','A camera that moves across the line in shot','Changing the lens'],a:1,w:'The audience sees the move, so they stay oriented.'}],apply:'shots'},
  {k:'cut30',t:'The 30° rule and jump cuts',sum:'When you cut to the same subject, change the angle by 30° or the size by two steps.',demo:'cut30',
   learn:['Cut between two very similar framings of the same person and the image seems to jump: that is a jump cut.','To make a cut invisible, change the camera angle by at least 30° or the shot size by at least two steps (a medium to a close-up, not a medium to a medium).','Jump cuts can be a style (energy, time passing, unease). Use them deliberately and consistently.'],
   why:['The eye accepts a clear change of view as a new shot.','A small change reads as a glitch in time.','Deliberate jump cuts become a rhythm of their own.'],
   mistakes:['Two mediums of the same person cut together.','Accidental jump cuts in an otherwise classical scene.','Using a zoom instead of a new set-up for a cut.'],
   exercise:'List three cuts on the same character in one of your scenes and say how each one changes angle or size enough.',crit:'each cut changes angle by about 30° or more, or size by two steps; any jump cut is deliberate',
   quiz:[{q:'Which cut risks a jump cut?',o:['Medium to close-up','Medium to medium from almost the same angle','Wide to medium'],a:1,w:'Too little change: it looks like a glitch.'},
     {q:'The 30° rule is about…',o:['Lens size','Changing the camera angle enough between cuts','The 180° line'],a:1,w:'A clear change of view makes the cut feel natural.'},
     {q:'Jump cuts are…',o:['Always mistakes','A valid style when used on purpose','Only for horror'],a:1,w:'Used consistently they give energy or unease.'}],apply:'shots'},
  {k:'angles',t:'Camera height, angle and power',sum:'Low angles lift people up. High angles push them down. Eye level is honest.',demo:'angles',
   learn:['Eye level is neutral: we meet the character as an equal.','A low angle (camera below the eyes, looking up) makes a character look dominant or threatening. A high angle (looking down) makes them smaller, weaker or watched.','A Dutch tilt says something is wrong. A top shot (bird’s-eye) turns people into patterns: fate, distance, design.','Track the power of the scene with the camera: as a character gains the upper hand, the angle on them can drop slowly.'],
   why:['Audiences read height instinctively as status.','Changing angle across a scene shows a power shift without words.','Consistency of angle keeps a scene’s point of view clear.'],
   mistakes:['Low angles on the character who is losing the scene, by accident.','Dutch tilts used for decoration.','Random heights that change from shot to shot.'],
   exercise:'In a scene where power flips, describe the camera height on each character at the start and at the end.',crit:'angles at the start match who has the power; angles change as power flips; any Dutch angle is motivated',
   quiz:[{q:'A low angle on a character usually makes them look…',o:['Weak','Dominant','Neutral'],a:1,w:'Looking up at someone gives them height and power.'},
     {q:'A Dutch tilt suggests…',o:['Calm','Unease or imbalance','Romance'],a:1,w:'The tilted horizon tells the audience something is off.'},
     {q:'How can angle show a power flip?',o:['Lower the camera on the rising character as the scene goes','Use the same angle throughout','Add music'],a:0,w:'The angle tracks the shift.'}],apply:'shots'},
  {k:'coverage',t:'Coverage: master, singles, inserts',sum:'Shoot enough to edit: a master for geography, singles for performance, inserts for details.',
   learn:['A master shot plays the whole scene wide, so the editor and the audience know where everyone is.','Singles and over-the-shoulders give performance: the face when the line lands, the reaction when it is heard.','Inserts and cutaways (hands, an object, a door) give the editor time and control.','Coverage costs time. Plan only what the scene needs: a one-take scene is a choice too.'],
   why:['Editors need options to shape rhythm and performance.','Reactions are often more powerful than lines.','Inserts let you compress or stretch time.'],
   mistakes:['No master: the geography is never clear.','No reaction shots: every line is on the speaker.','Over-covering a simple scene and running out of time.'],
   exercise:'Plan coverage for one of your scenes in 5 to 8 shots, naming the job of each shot.',crit:'a master or two-shot establishes geography; singles serve the key lines and reactions; at least one insert supports the turn; nothing redundant',
   quiz:[{q:'What is a master shot for?',o:['Showing geography and the whole action','Close emotion','Titles'],a:0,w:'It keeps everyone oriented.'},
     {q:'Why shoot reactions?',o:['They are cheap','Often the reaction carries the meaning','To fill time'],a:1,w:'The listener’s face shows how the line lands.'},
     {q:'Inserts help the editor…',o:['Change the lighting','Control time and detail','Cross the line'],a:1,w:'They are flexible pieces for rhythm.'}],apply:'shots'},
  {k:'threept',t:'Three-point and motivated light',sum:'Key, fill and back light, and a reason in the world for each of them.',demo:'threept',
   learn:['The key light is the main light on the face. The fill softens its shadows from the other side. The back light separates the person from the background.','Motivated light comes from a source the audience believes: a window, a lamp, a screen, a fire. Place the key where that source would be.','The ratio between key and fill sets the mood: a strong key with little fill is dramatic; an even key and fill is bright and open.','Keep the source consistent across a scene: if the window is camera left in the master, its light falls on the same side of the set in every shot (which can mean the other camera side in the reverse).'],
   why:['Motivated light feels real, so the audience stays in the story.','Separation light makes faces read on any background.','Controlling contrast controls mood.'],
   mistakes:['Light from nowhere: a bright face in a dark room with no source.','The window jumps sides between shots of the same scene.','Flat light on every shot regardless of mood.'],
   exercise:'For one scene, name the motivating source, where the key comes from, and how much fill you want, and why.',crit:'a believable source; key placement follows it; fill level matches the mood; consistent across the coverage',
   quiz:[{q:'Which light separates the subject from the background?',o:['Key','Fill','Back light'],a:2,w:'The back (rim) light draws an edge around the subject.'},
     {q:'Motivated light means…',o:['Very bright light','Light that seems to come from a source in the scene','Coloured light'],a:1,w:'The audience believes where it comes from.'},
     {q:'Less fill gives…',o:['A brighter, flatter look','More contrast and drama','No change'],a:1,w:'Darker shadows mean more drama.'}],apply:'shots'},
  {k:'keylow',t:'High-key, low-key and genre',sum:'Bright and even for comedy and ads, deep shadows for thrillers and drama.',demo:'keylow',
   learn:['High-key lighting is bright, soft and even, with few shadows. It suits comedy, family films, commercials and beauty.','Low-key lighting keeps most of the frame in shadow with a strong contrast between light and dark. It suits thrillers, noir, horror and intimate drama.','Pick one mood per scene and keep it, unless the story changes it: a door opens, a lamp goes out, dawn breaks.'],
   why:['Light sets the audience’s expectation before anyone speaks.','Consistency makes a scene feel like one place and time.','A deliberate change in light is a turn the audience feels.'],
   mistakes:['A high-key shot cut into a low-key scene.','Low-key so dark the faces disappear.','Night exteriors lit like daytime.'],
   exercise:'Choose the lighting mood for three scenes of your project and justify each choice by genre and story moment.',crit:'each mood fits the genre and the moment; changes are motivated; night and day are believable',
   quiz:[{q:'Which suits a thriller?',o:['High-key','Low-key','Flat overcast'],a:1,w:'Shadows hide information and build tension.'},
     {q:'A high-key shot inside a low-key scene will…',o:['Feel like a different scene','Look natural','Be invisible'],a:0,w:'The mood break is noticeable.'},
     {q:'How do you light night exteriors believably?',o:['Bright even daylight','Cool, low, one-sided light and practicals','No light at all'],a:1,w:'Moonlight and streetlights are directional and sparse.'}],apply:'shots'},
  {k:'colour',t:'Colour temperature and continuity',sum:'Warm tungsten, neutral daylight, cool blue: choose, motivate and keep it across the cuts.',demo:'colour',
   learn:['Light has a colour, measured in kelvin: candles and tungsten bulbs are warm (around 3200K), daylight is neutral (around 5600K), shade and dusk are cool (7000K and above).','Mixing warm practicals against cool ambient light is a classic look for night and evening interiors.','Within one scene, keep the colour temperature consistent between cuts. A sudden jump from warm to cool reads as a different time or place.'],
   why:['Colour sets emotion: warm feels close and safe, cool feels distant or tense.','Consistency hides the cuts.','A deliberate colour change marks a turn.'],
   mistakes:['One shot warm, the reverse cool, with no reason.','Daylight colour in a candlelit room.','Grading a whole film teal and orange by default.'],
   exercise:'Describe the colour plan for one scene, including the source and any change.',crit:'temperature matches the source; consistent across cuts; any change is motivated by the story',
   quiz:[{q:'Tungsten light is roughly…',o:['3200K, warm','5600K, neutral','9000K, blue'],a:0,w:'Tungsten and candles sit at the warm end.'},
     {q:'A colour jump between a shot and its reverse suggests…',o:['A change of time or place','Good coverage','Nothing'],a:0,w:'The audience reads it as a change.'},
     {q:'Warm practicals against cool ambient light is…',o:['A mistake','A classic evening or night look','Only for horror'],a:1,w:'The contrast is motivated and atmospheric.'}],apply:'shots'},
  {k:'format',t:'Screenplay format, and why it matters',sum:'One page is about one minute. Courier, fixed margins, and only what we can see and hear.',demo:'format',
   learn:['Scene headings say inside or outside, the place and the time: INT. KITCHEN - NIGHT.','Action is present tense and only what the camera sees or the microphone hears. No thoughts, no backstory.','Character names are in capitals above their lines; parentheticals are short and rare; transitions (CUT TO:) are mostly left to the editor.','The fixed layout (Courier 12, standard margins) means one page is about one minute of screen time. Producers budget and schedule from page counts, so they reject non-standard pages.','US scripts use US Letter; the UK, Europe and most of the world use A4 with the same layout. Use the paper your reader expects.'],
   why:['Readers can judge length and pace at a glance.','Departments break down the script reliably.','A clean format signals a professional.'],
   mistakes:['Writing thoughts and feelings in action lines.','Camera directions in every line.','Novel-length action paragraphs.','The wrong paper size for the market you submit to.'],
   exercise:'Rewrite a paragraph of prose from your source as screenplay action and dialogue.',crit:'present tense; only visible and audible information; short action paragraphs; correct headings and cues',
   quiz:[{q:'One standard screenplay page is about…',o:['10 seconds','1 minute','5 minutes'],a:1,w:'That is why the format is fixed.'},
     {q:'Which belongs in action lines?',o:['"She remembers her father"','"She turns the mug so the chip faces the wall"','"She feels guilty"'],a:1,w:'Only what we can see or hear.'},
     {q:'A UK broadcaster expects…',o:['US Letter','A4','A5'],a:1,w:'Same layout, A4 paper.'}],apply:'Tighten the action lines of this scene: present tense, only what we can see and hear, short paragraphs.'},
  {k:'av',t:'Commercials and the two-column AV script',sum:'Hook in three seconds, one message, product as the turn, end on the call to action.',demo:'av',
   learn:['A 30-second spot has room for one idea. Find the single message in the brief and cut everything else.','Structure: a hook (0 to 3 s) that stops the scroll, a human situation, the product or brand as the turn, a payoff, then the end card and call to action.','Agencies and clients read commercials and documentaries in a two-column AV script: video on the left, audio on the right, row by row, with timings. Export it from the Write step.','Mandatories from the brief (logo, product shot, legal line, call to action) are not optional. Tick them off before you send the script.'],
   why:['Clients approve what they can read quickly.','The AV layout lets producers time every second.','A clear single message is what audiences remember.'],
   mistakes:['Three messages in 30 seconds.','A slow opening.','Forgetting a mandatory from the brief.','A script that only works with voice-over.'],
   exercise:'Write a 30-second spot for a bakery that opens at dawn, as rows of video and audio with timings.',crit:'a hook in the first 3 seconds; one message; the product is the turn; ends on a call to action; timings add up to about 30 seconds',
   quiz:[{q:'How many core messages fit a 30-second spot?',o:['One','Three','Five'],a:0,w:'One idea, told well.'},
     {q:'What is on the left of an AV script?',o:['Audio','Video','Budget'],a:1,w:'Video left, audio right.'},
     {q:'Mandatories from the brief are…',o:['Suggestions','Required','Only for TV'],a:1,w:'Clients reject scripts that miss them.'}],apply:'Shape this as a commercial: a hook in the first three seconds, one message, the product as the turn, and end on the call to action.'},
  {k:'adapt',t:'Adapting a book, a memoir or a brief',sum:'Find the spine, externalise the inner life, compress time, merge people.',
   learn:['Prose lives inside heads; film lives in behaviour. Turn every important thought into an action, an object or a conversation.','Find the spine: the one want and the one change that carries the story. Keep what serves it, cut or merge the rest.','Compress time: ten conversations become one scene; three friends become one character.','For a memoir, stay truthful to what happened and how it felt. For a brief, the client’s requirements are fixed; your freedom is in how you tell it.'],
   why:['The screen needs visible conflict.','Running time forces choices; the spine guides them.','Faithfulness to feeling matters more than to every event.'],
   mistakes:['Voice-over to carry what the scenes should show.','Keeping every character from the book.','Changing the meaning of a real person’s story without saying so.'],
   exercise:'Take one paragraph of inner thought from your source and turn it into a short scene with behaviour and dialogue.',crit:'the thought is shown through action, an object or conversation; no voice-over; the feeling of the original survives',
   quiz:[{q:'How do you show a character’s thoughts on screen?',o:['Always voice-over','Through behaviour, objects and conversation','Title cards'],a:1,w:'Externalise the inner life.'},
     {q:'The spine of an adaptation is…',o:['Every event in the book','The one want and change that carries the story','The chapter titles'],a:1,w:'It decides what to keep.'},
     {q:'With a client brief, what is fixed?',o:['Nothing','The objective, message, mandatories and duration','Only the logo'],a:1,w:'Creative freedom lives inside those requirements.'}],apply:'Show the inner life of this scene through behaviour, objects and conversation instead of explanation.'}];

    {ok:false,c:'Centred with too much headroom: the person looks small.',svg:frameSVG(sc,mk({size:'Medium close-up',subj:['_dA'],_x:.5,_eye:.55}))},
    {ok:false,c:'Looking at the near edge: no look room.',svg:frameSVG(sc,mk({size:'Medium close-up',subj:['_dA'],_x:.72}))}])});
  if(k==='sizes')return withDemo(function(sc,mk){return demoPair(['Extreme close-up','Close-up','Medium close-up','Medium','Cowboy','Full','Wide','Extreme wide'].map(function(s){return {c:s+(s==='Extreme close-up'?': the eyes':s==='Close-up'?': head and top of the shoulders':s==='Medium close-up'?': mid-chest':s==='Medium'?': the waist':s==='Cowboy'?': above the knees':s==='Full'?': head to toe':s==='Wide'?': the person in their space':': scale, isolation'),svg:frameSVG(sc,mk({size:s,subj:['_dA']}))}}))});
  if(k==='line')return withDemo(function(sc,mk){var a=mk({size:'Medium close-up',framing:'Over-the-shoulder',subj:['_dA']}),b=mk({size:'Medium close-up',framing:'Over-the-shoulder',subj:['_dB']}),c=mk({size:'Medium close-up',framing:'Clean single',subj:['_dB'],look:'right'});
    sc.shots=[mk({size:'Medium wide',framing:'Two-shot',subj:['_dA','_dB']}),a,b,c];var plan=h('div',{class:'v9-plan demo-plan'});plan.innerHTML=floorPlanSVG(sc);
    var w=h('div',{class:'stack'});w.append(plan,h('p',{class:'hint',text:'Shots 1A to 1C stay on the camera side. 1D is shot from across the line, so B looks screen right, the same way as A.'}),
      demoPair([{ok:true,c:'1B: A looks screen right.',svg:frameSVG(sc,a)},{ok:true,c:'1C: B looks screen left. Their eyelines meet.',svg:frameSVG(sc,b)},{ok:false,c:'1D: crossed. B now looks screen right too.',svg:frameSVG(sc,c)}]));return w});
  if(k==='cut30')return withDemo(function(sc,mk){return demoPair([{ok:false,c:'Medium to medium, same angle: a jump.',svg:frameSVG(sc,mk({size:'Medium',subj:['_dA']}))+'',},{ok:false,c:'…the next shot looks almost the same.',svg:frameSVG(sc,mk({size:'Medium',subj:['_dA'],_x:.36}))},{ok:true,c:'Medium to close-up: a clean cut.',svg:frameSVG(sc,mk({size:'Close-up',subj:['_dA']}))}])});
  if(k==='angles')return withDemo(function(sc,mk){return demoPair([{c:'Eye level: equal, honest.',svg:frameSVG(sc,mk({size:'Medium',subj:['_dA']}))},{c:'Low angle: dominant.',svg:frameSVG(sc,mk({size:'Medium',subj:['_dA'],angle:'Low angle'}))},{c:'High angle: smaller, watched.',svg:frameSVG(sc,mk({size:'Medium',subj:['_dA'],angle:'High angle'}))},{c:'Dutch: unease.',svg:frameSVG(sc,mk({size:'Medium',subj:['_dA'],angle:'Dutch'}))}])});
  if(k==='threept'){var d=h('div',{class:'demo-row'}),f=h('figure',{class:'demo'}),s=h('div',{class:'demo-f'});
    s.innerHTML='<svg viewBox="0 0 300 190" role="img" aria-label="Three-point lighting plan"><circle cx="150" cy="70" r="16" fill="none" stroke="currentColor" stroke-width="2"/><text x="150" y="74" text-anchor="middle" font-size="10" fill="currentColor">subject</text>'+
      '<rect x="138" y="160" width="24" height="16" rx="3" fill="var(--accent,#0071E3)"/><text x="150" y="188" text-anchor="middle" font-size="10" fill="currentColor">camera</text>'+
      '<g fill="#e3a008"><circle cx="70" cy="130" r="11"/><circle cx="235" cy="125" r="8" fill-opacity=".55"/><circle cx="205" cy="18" r="8"/></g><g stroke="#e3a008" stroke-width="1.5" stroke-dasharray="4 3"><path d="M80 122 138 80M226 119 164 78M199 25 160 56"/></g>'+
